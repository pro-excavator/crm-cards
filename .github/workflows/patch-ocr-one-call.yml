name: Patch OCR to one API call

on:
  push:
    paths:
      - '.github/workflows/patch-ocr-one-call.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply OCR patch
        run: python .github/scripts/patch_ocr.py
      - name: Validate
        run: |
          grep -q "async function callVisionOnce" index.html
          ! grep -q "async function callVisionRaw" index.html
          grep -q "CRM v8.7" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Optimize OCR to one Qwen-VL call per image"
            git push origin HEAD:main
          fi
